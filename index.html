<!--
  맘풀고 공개 카드 갤러리 v48.0
  - 공개 화면에서는 카드 보기·선택만 제공합니다.
  - 공개 화면에서는 카드 보기·선택만 제공합니다.
  - 카드 메이커에는 기존과 동일하게 media_url을 전달합니다.
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4A90E2">
  <title>맘풀고 카드 갤러리</title>
  <style>
    :root { --blue:#4a90e2; --blue-dark:#2871c7; --ink:#213047; --muted:#667085; --line:#e7ebf0; --bg:#f5f7fb; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .container { max-width:1200px; margin:0 auto; padding:32px 20px 56px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:26px; }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .brand h1 { margin:0; font-size:clamp(25px, 4vw, 34px); letter-spacing:-.05em; }
    .brand p { margin:8px 0 0; color:var(--muted); font-size:15px; }
    .home-link { display:inline-flex; align-items:center; justify-content:center; border-radius:12px; padding:11px 15px; color:var(--blue); background:#edf5ff; font-size:14px; font-weight:750; text-decoration:none; white-space:nowrap; }
    .toolbar { background:var(--white); border:1px solid var(--line); border-radius:18px; padding:17px; box-shadow:0 8px 28px rgba(30, 51, 84, .05); margin-bottom:26px; }
    .toolbar-label { display:block; margin-bottom:11px; color:#344054; font-size:14px; font-weight:800; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; }
    .filter { border:1px solid #dbe4ef; background:#fff; color:#526176; border-radius:999px; padding:8px 13px; cursor:pointer; font:inherit; font-size:14px; font-weight:700; transition:.16s ease; }
    .filter:hover { border-color:var(--blue); color:var(--blue); }
    .filter.active { border-color:var(--blue); background:var(--blue); color:#fff; }
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:20px; }
    .card { min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:17px; background:var(--white); cursor:pointer; box-shadow:0 5px 17px rgba(24,44,76,.06); transition:transform .2s ease, box-shadow .2s ease; }
    .card:hover { transform:translateY(-5px); box-shadow:0 14px 28px rgba(24,44,76,.15); }
    .media-container { position:relative; display:flex; align-items:center; justify-content:center; width:100%; height:276px; overflow:hidden; background:linear-gradient(135deg,#e9eef6,#f8fafc); }
    .media-container img, .media-container video { width:100%; height:100%; object-fit:cover; }
    .badge { position:absolute; top:11px; right:11px; border-radius:999px; padding:5px 9px; color:#fff; background:rgba(20,32,52,.72); font-size:11px; font-weight:800; backdrop-filter:blur(5px); }
    .card-body { padding:13px 14px 15px; }
    .category { display:block; margin-bottom:5px; color:var(--blue); font-size:12px; font-weight:800; }
    .name { display:block; overflow:hidden; color:#27364a; font-size:14px; font-weight:750; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; }
    .state { grid-column:1/-1; margin:32px 0; color:var(--muted); font-size:15px; text-align:center; }
    .state.error { color:#d92d20; }
    @media (max-width:640px) { .container { padding:23px 16px 44px; } header { align-items:flex-start; flex-direction:column; } .header-actions { width:100%; } .home-link { width:100%; } .gallery-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .media-container { height:220px; } .card-body { padding:11px; } }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="brand">
        <h1>맘풀고 카드 갤러리</h1>
        <p>마음을 담을 배경을 고르고 나만의 카드를 만들어 보세요.</p>
      </div>
      <div class="header-actions">
        <a class="home-link" href="https://mampulgo.com/make-card/">카드 만들기로 돌아가기</a>
      </div>
    </header>

    <section class="toolbar" aria-label="카테고리 선택">
      <span class="toolbar-label">카테고리</span>
      <div class="filters" id="filters"></div>
    </section>

    <section class="gallery-grid" id="gallery" aria-live="polite">
      <p class="state">카드를 불러오는 중입니다.</p>
    </section>

  </main>

  <script>
    const CONFIG = {
      username: 'yongfafa0218-ops',
      repo: 'card-gallery',
      branch: 'main',
      wpUrl: 'https://mampulgo.com/make-card/'
    };
    const DATA_URL = './gallery-data.json';
    let galleryData = null;
    let activeCategory = 'all';

    function rawUrl(path) {
      const encodedPath = path.split('/').map(encodeURIComponent).join('/');
      return `https://raw.githubusercontent.com/${CONFIG.username}/${CONFIG.repo}/${CONFIG.branch}/${encodedPath}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    }

    function renderFilters() {
      const filters = document.getElementById('filters');
      const items = [{ id:'all', name:'전체' }, ...galleryData.categories];
      filters.innerHTML = items.map(category => `
        <button class="filter ${category.id === activeCategory ? 'active' : ''}" type="button" data-category="${escapeHtml(category.id)}">
          ${escapeHtml(category.name)}
        </button>
      `).join('');
      filters.querySelectorAll('.filter').forEach(button => {
        button.addEventListener('click', () => {
          activeCategory = button.dataset.category;
          renderFilters();
          renderGallery();
        });
      });
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const categories = Object.fromEntries(galleryData.categories.map(category => [category.id, category.name]));
      const cards = galleryData.cards.filter(card => activeCategory === 'all' || card.category === activeCategory);
      if (!cards.length) {
        gallery.innerHTML = '<p class="state">이 카테고리에는 아직 카드가 없습니다.</p>';
        return;
      }
      gallery.innerHTML = cards.map(card => {
        const isVideo = card.type === 'video';
        const url = rawUrl(card.path);
        return `
          <article class="card" tabindex="0" role="button" data-path="${escapeHtml(card.path)}" aria-label="${escapeHtml(card.name)} 카드 선택">
            <div class="media-container">
              ${isVideo ? `<video src="${url}" muted loop playsinline preload="metadata"></video>` : `<img src="${url}" alt="${escapeHtml(card.name)}" loading="lazy">`}
              <span class="badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span>
            </div>
            <div class="card-body">
              <span class="category">${escapeHtml(categories[card.category] || '기본')}</span>
              <span class="name">${escapeHtml(card.name)}</span>
            </div>
          </article>
        `;
      }).join('');

      gallery.querySelectorAll('.card').forEach(card => {
        const chooseCard = () => {
          const targetUrl = new URL(CONFIG.wpUrl);
          targetUrl.searchParams.set('media_url', rawUrl(card.dataset.path));
          window.location.assign(targetUrl.href);
        };
        card.addEventListener('click', chooseCard);
        card.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); chooseCard(); }
        });
        const video = card.querySelector('video');
        if (video) {
          card.addEventListener('mouseenter', () => video.play().catch(() => {}));
          card.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
        }
      });
    }

    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      try {
        const response = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache:'no-store' });
        if (!response.ok) throw new Error(`목록 파일을 불러오지 못했습니다. (${response.status})`);
        galleryData = await response.json();
        if (!Array.isArray(galleryData.categories) || !Array.isArray(galleryData.cards)) throw new Error('카드 목록 형식이 올바르지 않습니다.');
        renderFilters();
        renderGallery();
      } catch (error) {
        console.error(error);
        gallery.innerHTML = `<p class="state error">카드 목록을 불러오지 못했습니다.<br><small>${escapeHtml(error.message)}</small></p>`;
      }
    }

    loadGallery();
  </script>
</body>
</html>
