<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘풀고 Pro 관리자 패널</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --sidebar-bg: #1e293b;
            --sidebar-hover: #334155;
            --bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --white: #ffffff;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; color: var(--text-main); }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar-bg); color: white; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 30px 20px; font-size: 22px; font-weight: 900; letter-spacing: -1px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
        .sidebar-header span { color: var(--primary); }
        
        .category-nav { flex: 1; padding: 20px 15px; overflow-y: auto; }
        .nav-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; padding-left: 10px; font-weight: bold; }
        .cat-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
        .cat-item:hover { background: var(--sidebar-hover); }
        .cat-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3); }
        
        .btn-new-cat { margin: 20px 15px; padding: 12px; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); color: #cbd5e1; border-radius: 10px; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; }
        .btn-new-cat:hover { background: rgba(255,255,255,0.1); color: white; border-color: white; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .header { height: 70px; background: var(--white); border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .path-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
        
        .top-actions { display: flex; gap: 12px; align-items: center; }
        .btn-admin-toggle { background: #f1f5f9; color: var(--text-main); border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-admin-toggle.active { background: var(--primary); color: white; border-color: var(--primary); }

        .content { flex: 1; overflow-y: auto; padding: 30px; }

        /* Admin Dashboard Overlay */
        #admin-panel { display: none; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .admin-card { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .admin-card h4 { margin: 0 0 15px 0; font-size: 14px; color: var(--text-muted); }
        
        /* Gallery Grid */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; }
        .item-card { background: var(--white); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; position: relative; border: 1px solid #f1f5f9; }
        .item-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .media-wrap { width: 100%; height: 320px; background: #f1f5f9; position: relative; overflow: hidden; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        
        .badge { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.7); color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; backdrop-filter: blur(4px); }
        .item-meta { padding: 15px; text-align: center; }
        .item-name { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .action-btns { position: absolute; top: 12px; left: 12px; display: none; gap: 5px; }
        .item-card:hover .action-btns { display: flex; }
        .btn-icon { background: var(--danger); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }

        /* Form Elements */
        .input-group { display: flex; gap: 8px; }
        input { padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 14px; width: 100%; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1); }
        .btn-solid { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }

        /* Loader */
        .spinner { border: 3px solid #e2e8f0; border-top: 3px solid var(--primary); border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 900px) {
            .sidebar { width: 80px; }
            .sidebar-header span, .cat-item span, .btn-new-cat, .nav-label { display: none; }
            .cat-item { justify-content: center; padding: 15px 0; }
            .sidebar-header { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span>Mampulgo</span> Pro
        </div>
        <nav class="category-nav">
            <div class="nav-label">Categories</div>
            <div id="cat-list">
                <div class="cat-item active" onclick="changeCat('')">📂 <span>전체보기</span></div>
            </div>
            <div id="admin-cat-action" style="display:none;">
                <div class="btn-new-cat" onclick="toggleModal('modal-cat', true)">+ 카테고리 추가</div>
            </div>
        </nav>
    </aside>

    <!-- Main -->
    <main class="main">
        <header class="header">
            <div class="path-info">
                <span id="path-text">전체보기</span>
            </div>
            <div class="top-actions">
                <a href="https://mampulgo.com/make-card/" style="text-decoration:none; color:var(--text-muted); font-size:13px; margin-right:15px;">🏠 카드 홈</a>
                <div id="global-spinner" class="spinner" style="display:none;"></div>
                <button id="admin-btn" class="btn-admin-toggle" onclick="toggleAdminMode()">🔒 관리자 로그인</button>
            </div>
        </header>

        <div class="content">
            <!-- Admin Dashboard -->
            <section id="admin-panel">
                <div class="admin-grid">
                    <div class="admin-card">
                        <h4>GitHub API 인증</h4>
                        <div class="input-group">
                            <input type="password" id="token-input" placeholder="ghp_... 토큰 입력">
                            <button class="btn-solid" onclick="saveAuth()">인증 저장</button>
                        </div>
                    </div>
                    <div class="admin-card">
                        <h4>미디어 업로드</h4>
                        <div class="input-group">
                            <label for="file-input" class="btn-outline" style="flex:1; text-align:center;">📁 파일 선택</label>
                            <input type="file" id="file-input" style="display:none;" onchange="handleUpload(this)">
                            <button class="btn-danger" id="del-cat-btn" style="display:none;" onclick="handleDelCat()">카테고리 삭제</button>
                        </div>
                        <div id="upload-msg" style="margin-top:10px; font-size:12px; color:var(--primary); font-weight:bold;"></div>
                    </div>
                </div>
            </section>

            <!-- Gallery -->
            <div class="gallery" id="gallery-grid">
                <!-- Media cards -->
            </div>
        </div>
    </main>

    <!-- Modal: New Category -->
    <div class="modal-overlay" id="modal-cat">
        <div class="modal-box">
            <h3 style="margin-top:0;">새 카테고리 생성</h3>
            <p style="font-size:13px; color:var(--text-muted);">영문 이름을 권장합니다 (예: wedding, birthday)</p>
            <input type="text" id="new-cat-input" placeholder="카테고리 이름 입력" style="margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button class="btn-solid" style="flex:1;" onclick="handleCreateCat()">생성하기</button>
                <button class="btn-outline" style="flex:1;" onclick="toggleModal('modal-cat', false)">취소</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            user: "yongfafa0218-ops",
            repo: "card-gallery",
            wp: "https://mampulgo.com/make-card/"
        };
        
        let isAdmin = false;
        let currentCat = '';
        let allData = [];

        window.onload = () => {
            // Check if token exists
            if (localStorage.getItem('gh_token')) {
                document.getElementById('token-input').value = localStorage.getItem('gh_token');
            }
            
            // Initial Load
            refreshUI();
        };

        // --- Core UI Logic ---

        function toggleAdminMode() {
            isAdmin = !isAdmin;
            const btn = document.getElementById('admin-btn');
            const panel = document.getElementById('admin-panel');
            const catAction = document.getElementById('admin-cat-action');
            
            if (isAdmin) {
                btn.innerText = "🔓 관리자 모드 중";
                btn.classList.add('active');
                panel.style.display = 'block';
                catAction.style.display = 'block';
            } else {
                btn.innerText = "🔒 관리자 로그인";
                btn.classList.remove('active');
                panel.style.display = 'none';
                catAction.style.display = 'none';
            }
            renderGallery(); // Re-render to show/hide delete buttons
        }

        async function refreshUI() {
            await loadCategories();
            await loadMedia();
        }

        async function ghApi(path, method = 'GET', body = null) {
            const token = localStorage.getItem('gh_token');
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) headers['Authorization'] = `token ${token}`;
            
            document.getElementById('global-spinner').style.display = 'block';
            try {
                const options = { method, headers };
                if (body) options.body = JSON.stringify(body);
                
                const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`, options);
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message);
                }
                return await res.json();
            } finally {
                document.getElementById('global-spinner').style.display = 'none';
            }
        }

        async function loadCategories() {
            try {
                const data = await ghApi('');
                const cats = data.filter(i => i.type === 'dir').map(i => i.name);
                const list = document.getElementById('cat-list');
                list.innerHTML = `<div class="cat-item ${currentCat === '' ? 'active' : ''}" onclick="changeCat('')">📂 <span>전체보기</span></div>`;
                cats.forEach(c => {
                    list.innerHTML += `<div class="cat-item ${currentCat === c ? 'active' : ''}" onclick="changeCat('${c}')">📁 <span>${c}</span></div>`;
                });
            } catch (e) { console.error(e); }
        }

        async function loadMedia() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:50px; color:#94a3b8;">미디어를 불러오는 중...</p>';
            
            try {
                if (currentCat === '') {
                    const root = await ghApi('');
                    let files = root.filter(i => i.type === 'file');
                    // Also get files from first-level subdirs for "All" view
                    const dirs = root.filter(i => i.type === 'dir');
                    for (const d of dirs) {
                        const sub = await ghApi(d.path);
                        files = [...files, ...sub.filter(i => i.type === 'file')];
                    }
                    allData = files;
                } else {
                    const data = await ghApi(currentCat);
                    allData = data.filter(i => i.type === 'file');
                }
                renderGallery();
            } catch (e) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:50px; color:red;">불러오기 실패: ${e.message}</p>`;
            }
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            const valid = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'mp4', 'mov'];
            const filtered = allData.filter(f => valid.includes(f.name.split('.').pop().toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:50px; color:#94a3b8;">이 폴더에 미디어가 없습니다.</p>';
                return;
            }

            filtered.forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const isVid = ext === 'mp4' || ext === 'mov';
                
                // CRITICAL FIX: Use download_url for instant preview, and relative path for production
                const previewUrl = file.download_url; 
                const prodUrl = `${window.location.origin}/${file.path}`;

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    ${isAdmin ? `<div class="action-btns"><button class="btn-icon" onclick="handleDelFile('${file.path}', '${file.sha}', event)">🗑️</button></div>` : ''}
                    <div class="media-wrap">
                        ${isVid ? `<video src="${previewUrl}" muted loop playsinline></video>` : `<img src="${previewUrl}" onerror="this.src='https://placehold.co/400x600?text=Error'">`}
                        <span class="badge">${isVid ? 'VIDEO' : 'IMAGE'}</span>
                    </div>
                    <div class="item-meta">
                        <div class="item-name">${file.name}</div>
                    </div>
                `;
                
                if(isVid) {
                    card.onmouseenter = () => card.querySelector('video').play();
                    card.onmouseleave = () => card.querySelector('video').pause();
                }
                
                card.onclick = () => {
                    window.location.href = `${CONFIG.wp}?img_url=${encodeURIComponent(prodUrl)}`;
                };
                grid.appendChild(card);
            });
        }

        function changeCat(cat) {
            currentCat = cat;
            document.getElementById('path-text').innerText = cat === '' ? '전체보기' : cat;
            document.getElementById('del-cat-btn').style.display = cat === '' ? 'none' : 'inline-block';
            refreshUI();
        }

        // --- Admin Actions ---

        function saveAuth() {
            const val = document.getElementById('token-input').value.trim();
            if (val.startsWith('ghp_')) {
                localStorage.setItem('gh_token', val);
                alert("인증 정보가 저장되었습니다.");
                refreshUI();
            } else { alert("올바른 토큰을 입력하세요."); }
        }

        async function handleUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const msg = document.getElementById('upload-msg');
            msg.innerText = "🚀 업로드 중...";
            
            try {
                const reader = new FileReader();
                reader.onload = async () => {
                    const content = reader.result.split(',')[1];
                    const name = `${Date.now()}_${file.name}`;
                    const path = currentCat ? `${currentCat}/${name}` : name;
                    
                    await ghApi(path, 'PUT', { message: `Upload ${name}`, content });
                    msg.innerText = "✅ 업로드 완료! (배포 대기중)";
                    input.value = "";
                    setTimeout(loadMedia, 2000);
                };
                reader.readAsDataURL(file);
            } catch (e) { alert(e.message); msg.innerText = ""; }
        }

        async function handleCreateCat() {
            const name = document.getElementById('new-cat-input').value.trim();
            if (!name) return;
            try {
                await ghApi(`${name}/.keep`, 'PUT', { message: `Create dir ${name}`, content: btoa('') });
                toggleModal('modal-cat', false);
                changeCat(name);
            } catch (e) { alert(e.message); }
        }

        async function handleDelCat() {
            if (!currentCat || !confirm(`'${currentCat}' 폴더와 내부 파일을 모두 삭제하시겠습니까?`)) return;
            try {
                const files = await ghApi(currentCat);
                for (const f of files) {
                    await ghApi(f.path, 'DELETE', { message: `Cleanup for cat delete`, sha: f.sha });
                }
                changeCat('');
            } catch (e) { alert(e.message); }
        }

        async function handleDelFile(path, sha, e) {
            e.stopPropagation();
            if (!confirm("이 파일을 삭제하시겠습니까?")) return;
            try {
                await ghApi(path, 'DELETE', { message: `Delete file`, sha });
                loadMedia();
            } catch (e) { alert(e.message); }
        }

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
