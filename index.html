<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘풀고 카드 템플릿 관리자</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin-bottom: 10px; font-weight: 800; }
        .upload-section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        .token-box { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        #token-input { padding: 10px; border-radius: 8px; border: 1px solid #ddd; width: 300px; font-size: 13px; }
        .btn-save-token { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .custom-file-upload { background: #4A90E2; color: white; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-weight: bold; display: inline-block; transition: 0.3s; font-size: 16px; }
        .custom-file-upload:hover { background: #357ABD; transform: scale(1.02); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .media-container { width: 100%; height: 280px; background: #eee; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; }
        .info { padding: 12px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4A90E2; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-msg { margin-top: 15px; font-size: 14px; color: #4A90E2; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎬 카드 템플릿 관리</h1>
        <p>파일을 올리면 깃허브에 저장되고 네틀리파이에 즉시 반영됩니다.</p>
        <a href="https://mampulgo.com/make-card/" style="color: #4A90E2; text-decoration: none; font-weight: bold;">🏠 카드 만들기 홈으로</a>
    </header>

    <div class="upload-section">
        <div class="token-box">
            <input type="password" id="token-input" placeholder="GitHub 토큰(ghp_... )을 붙여넣으세요">
            <button class="btn-save-token" onclick="saveToken()">🔑 토큰 저장하기</button>
        </div>
        <div id="upload-controls" style="display:none;">
            <label for="file-upload" class="custom-file-upload">📁 템플릿 파일 선택하여 업로드</label>
            <input id="file-upload" type="file" accept="image/*,video/mp4,video/quicktime" onchange="uploadFile(this)">
            <div id="loader" class="loader"></div>
            <div id="status-msg"></div>
        </div>
        <p id="token-notice" style="color: #ff6b6b; font-weight: bold;">⚠️ 먼저 토큰을 저장해야 업로드 버튼이 나타납니다.</p>
    </div>

    <div class="gallery-grid" id="gallery"></div>
</div>

<script>
    const CONFIG = { username: "yongfafa0218-ops", repo: "card-gallery", wpUrl: "https://mampulgo.com/make-card/" };

    window.onload = ( ) => {
        const savedToken = localStorage.getItem('gh_token');
        if (savedToken) {
            document.getElementById('token-input').value = savedToken;
            showUploadControls();
        }
        fetchGallery(); // 페이지 로드 시 갤러리 불러오기
    };

    function saveToken() {
        const token = document.getElementById('token-input').value.trim();
        if (token.startsWith('ghp_')) {
            localStorage.setItem('gh_token', token);
            alert("토큰이 저장되었습니다!");
            showUploadControls();
            fetchGallery(); // 토큰 저장 후 갤러리 다시 시도
        } else {
            alert("올바른 토큰을 입력해주세요.");
        }
    }

    function showUploadControls() {
        document.getElementById('upload-controls').style.display = 'block';
        document.getElementById('token-notice').style.display = 'none';
    }

    async function fetchGallery() {
        const gallery = document.getElementById('gallery');
        const token = localStorage.getItem('gh_token');
        gallery.innerHTML = '<p style="text-align:center; width:100%;">불러오는 중...</p>';
        
        try {
            const headers = token ? { 'Authorization': `token ${token}` } : {};
            const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/`, { headers } );
            const files = await response.json();
            
            if (!Array.isArray(files)) throw new Error(files.message || "목록 로드 실패");

            gallery.innerHTML = '';
            const validExts = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'mp4', 'mov'];
            
            files.filter(f => validExts.includes(f.name.split('.').pop().toLowerCase()))
                 .forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    const isVideo = ext === 'mp4' || ext === 'mov';
                    const fileUrl = `${window.location.origin}/${file.name}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="media-container">
                            ${isVideo ? `<video src="${fileUrl}" muted loop playsinline></video>` : `<img src="${fileUrl}">`}
                            <span class="badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span>
                        </div>
                        <div class="info">${file.name}</div>
                    `;
                    
                    if(isVideo) {
                        card.onmouseenter = () => card.querySelector('video').play();
                        card.onmouseleave = () => card.querySelector('video').pause();
                    }
                    card.onclick = () => { window.location.href = `${CONFIG.wpUrl}?img_url=${encodeURIComponent(fileUrl)}`; };
                    gallery.appendChild(card);
                 });
        } catch (e) {
            gallery.innerHTML = `<p style="text-align:center; color:red;">갤러리 로드 실패: ${e.message}  
토큰을 저장한 후 새로고침 해보세요.</p>`;
        }
    }

    async function uploadFile(input) {
        const file = input.files[0];
        const token = localStorage.getItem('gh_token');
        const status = document.getElementById('status-msg');
        const loader = document.getElementById('loader');

        if (!file || !token) return;
        loader.style.display = 'block';
        status.innerText = "업로드 중...";

        try {
            const reader = new FileReader();
            reader.onload = async () => {
                const content = reader.result.split(',')[1];
                const fileName = Date.now() + "_" + file.name;
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Upload ${fileName}`, content: content } )
                });

                if (response.ok) {
                    status.innerText = "✅ 성공! 1분 뒤 반영됩니다.";
                    input.value = "";
                    setTimeout(fetchGallery, 3000);
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            };
            reader.readAsDataURL(file);
        } catch (e) {
            alert("업로드 오류: " + e.message);
            status.innerText = "❌ 오류 발생";
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
