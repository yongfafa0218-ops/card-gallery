<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘풀고 카드 템플릿 관리자 v42.0</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { margin-bottom: 10px; font-weight: 800; }
        .version-tag { background: #4A90E2; color: white; padding: 2px 8px; border-radius: 5px; font-size: 12px; vertical-align: middle; margin-left: 10px; }
        .upload-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; text-align: center; }
        .upload-btn-wrapper { margin-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        input[type="file"] { display: none; }
        .custom-file-upload { background: #4A90E2; color: white; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; display: inline-block; transition: 0.3s; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.08); cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .media-container { width: 100%; height: 280px; background: #eee; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; backdrop-filter: blur(4px); }
        .info { padding: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4A90E2; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-msg { margin-top: 10px; font-size: 14px; color: #4A90E2; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🎬 카드 템플릿 관리 <span class="version-tag">v42.0</span></h1>
        <p>이미지를 클릭하면 카드 만들기 페이지로 즉시 연결됩니다.</p>
        <a href="https://mampulgo.com/make-card/" style="color: #4A90E2; text-decoration: none; font-weight: bold;">🏠 카드 만들기 홈으로</a>
    </header>
    <div class="upload-section">
        <h3>새 템플릿 추가하기</h3>
        <div class="upload-btn-wrapper">
            <label for="file-upload" class="custom-file-upload">📁 파일 선택하여 업로드</label>
            <input id="file-upload" type="file" accept="image/*,video/mp4,video/quicktime" onchange="uploadFile(this)">
            <div id="loader" class="loader"></div>
            <div id="status-msg"></div>
        </div>
    </div>
    <div class="gallery-grid" id="gallery"></div>
</div>
<script>
    const CONFIG = {
        username: "yongfafa0218-ops",
        repo: "card-gallery",
        wpUrl: "https://mampulgo.com/make-card/"
    };

    window.onload = () => fetchGallery();

    async function fetchGallery() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '<p style="text-align:center; width:100%;">이미지를 불러오는 중...</p>';
        try {
            const token = localStorage.getItem('gh_token');
            const headers = token ? { 'Authorization': `token ${token}` } : {};

            // 🚀 모든 파일과 폴더를 가져옴 (재귀적 탐색)
            async function getFiles(path = "") {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${path}`, { headers });
                const items = await res.json();
                let files = [];
                for (let item of items) {
                    if (item.type === 'file') files.push(item);
                    else if (item.type === 'dir') files = files.concat(await getFiles(item.path));
                }
                return files;
            }

            const allFiles = await getFiles();
            gallery.innerHTML = '';
            const validExts = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'mp4', 'mov'];
            
            allFiles.filter(f => validExts.includes(f.name.split('.').pop().toLowerCase()))
                 .forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    const isVideo = ext === 'mp4' || ext === 'mov';
                    
                    // 🚀 전체 경로(path)를 사용하여 주소 생성 (중요!)
                    const fileUrl = `${window.location.origin}/${file.path.split('/').map(encodeURIComponent).join('/')}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<div class="media-container">${isVideo ? `<video src="${fileUrl}" muted loop playsinline></video>` : `<img src="${fileUrl}">`}<span class="badge">${isVideo ? 'VIDEO' : 'IMAGE'}</span></div><div class="info">${file.name}</div>`;
                    
                    card.onclick = () => {
                        window.location.href = `${CONFIG.wpUrl}?img_url=${encodeURIComponent(fileUrl)}`;
                    };
                    gallery.appendChild(card);
                 });
        } catch (e) { gallery.innerHTML = '<p>불러오기 실패. 잠시 후 다시 시도해주세요.</p>'; }
    }

    async function uploadFile(input) {
        const file = input.files[0];
        if (!file) return;
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt("GitHub 토큰을 입력하세요 (최초 1회):");
            if (!token) return;
            localStorage.setItem('gh_token', token);
        }
        document.getElementById('loader').style.display = 'block';
        try {
            const reader = new FileReader();
            reader.onload = async () => {
                const content = reader.result.split(',')[1];
                const fileName = Date.now() + "_" + file.name;
                const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Upload ${fileName}`, content: content })
                });
                if (response.ok) { alert("업로드 성공!"); location.reload(); }
                else { localStorage.removeItem('gh_token'); alert("토큰 오류!"); }
            };
            reader.readAsDataURL(file);
        } catch (e) { alert("오류 발생"); } finally { document.getElementById('loader').style.display = 'none'; }
    }
</script>
</body>
</html>
