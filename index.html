<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘풀고 Pro 관리자 패널 v2.4</title>
    <style>
        :root { --primary: #4A90E2; --bg: #f8fafc; --white: #ffffff; --danger: #ef4444; --success: #10b981; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: #1e293b; color: white; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-header { padding: 25px; font-size: 20px; font-weight: 900; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .cat-nav { flex: 1; padding: 20px; overflow-y: auto; }
        .cat-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        .cat-item:hover { background: #334155; }
        .cat-item.active { background: var(--primary); color: white; }
        .btn-new-cat { margin: 15px; padding: 10px; background: rgba(255,255,255,0.05); border: 1px dashed #444; color: #ccc; border-radius: 8px; cursor: pointer; text-align: center; font-size: 13px; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 70px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        #admin-panel { display: none; background: #eef6ff; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #d0e3f9; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; position: relative; border: 1px solid #eee; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .media-wrap { width: 100%; height: 300px; background: #f1f5f9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .media-wrap img, .media-wrap video { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; z-index: 10; }
        .info { padding: 12px; font-size: 13px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-btns { position: absolute; top: 10px; left: 10px; display: none; gap: 8px; z-index: 999 !important; }
        body.is-admin .admin-btns { display: flex !important; }
        .btn-action { width: 40px; height: 40px; border-radius: 10px; border: 2px solid white; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-del { background: #ef4444 !important; }
        .btn-move { background: #10b981 !important; }
        .btn-solid { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-admin { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-admin.active { background: var(--primary); color: white; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; outline: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: white; padding: 30px; border-radius: 20px; width: 400px; text-align: center; }
    </style>
</head>
<body id="main-body">
    <aside class="sidebar">
        <div class="sidebar-header">Mampulgo <b>Pro</b></div>
        <nav class="cat-nav">
            <div id="cat-list"><div class="cat-item active" onclick="changeCat('')">📂 전체보기</div></div>
            <div id="admin-cat-ui" style="display:none;"><div class="btn-new-cat" onclick="openModal('modal-cat')">+ 새 카테고리 추가</div></div>
        </nav>
    </aside>
    <main class="main">
        <header class="header">
            <div id="path-text" style="font-weight:bold; font-size:18px;">전체보기</div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="btn-admin" onclick="refresh()" style="background:#fff; border-color:#4A90E2; color:#4A90E2;">🔄 갤러리 새로고침</button>
                <a href="https://mampulgo.com/make-card/" style="text-decoration:none; color:#888; font-size:13px;">🏠 홈</a>
                <button id="admin-toggle" class="btn-admin" onclick="toggleAdmin( )">🔒 관리자 로그인</button>
            </div>
        </header>
        <div class="content">
            <section id="admin-panel">
                <div class="admin-grid">
                    <div>
                        <h4 style="margin:0 0 10px 0;">GitHub 인증</h4>
                        <div style="display:flex; gap:5px;"><input type="password" id="token-input" placeholder="ghp_... 토큰 입력"><button class="btn-solid" onclick="saveToken()">저장</button></div>
                    </div>
                    <div>
                        <h4 style="margin:0 0 10px 0;">파일 업로드</h4>
                        <div style="display:flex; gap:5px;"><label for="file-up" class="btn-solid" style="flex:1; text-align:center; background:#333;">📁 파일 선택</label><input type="file" id="file-up" style="display:none;" onchange="handleUpload(this)"><button class="btn-solid" style="background:#ef4444; display:none;" id="del-cat-btn" onclick="delCat()">폴더 삭제</button></div>
                        <div id="up-status" style="margin-top:5px; font-size:12px; color:var(--primary);"></div>
                    </div>
                </div>
            </section>
            <div class="gallery" id="gallery-grid"></div>
        </div>
    </main>
    <div class="modal" id="modal-cat"><div class="modal-box"><h3>새 카테고리 이름</h3><input type="text" id="new-cat-name" placeholder="영문 권장"><div style="display:flex; gap:10px; margin-top:20px;"><button class="btn-solid" style="flex:1;" onclick="createCat()">생성</button><button class="btn-solid" style="flex:1; background:#888;" onclick="closeModal('modal-cat')">취소</button></div></div></div>
    <div class="modal" id="modal-move"><div class="modal-box"><h3>파일 이동 및 이름 변경</h3><div style="text-align:left; margin-bottom:15px;"><label style="font-size:12px;">파일명</label><input type="text" id="move-name"></div><div style="text-align:left; margin-bottom:20px;"><label style="font-size:12px;">카테고리 선택</label><select id="move-cat-select"></select></div><div style="display:flex; gap:10px;"><button class="btn-solid" style="flex:1;" id="move-confirm-btn">적용하기</button><button class="btn-solid" style="flex:1; background:#888;" onclick="closeModal('modal-move')">취소</button></div></div></div>
    <script>
        const CONFIG = { user: "yongfafa0218-ops", repo: "card-gallery", wp: "https://mampulgo.com/make-card/" };
        let isAdmin = false, currentCat = '', allFiles = [], categories = [];
        window.onload = ( ) => { const saved = localStorage.getItem('gh_token'); if(saved) document.getElementById('token-input').value = saved; refresh(); };
        function toggleAdmin() { isAdmin = !isAdmin; const body = document.getElementById('main-body'); const btn = document.getElementById('admin-toggle'); if(isAdmin) { body.classList.add('is-admin'); btn.innerText = "🔓 관리자 모드 중"; btn.classList.add('active'); document.getElementById('admin-panel').style.display = 'block'; document.getElementById('admin-cat-ui').style.display = 'block'; } else { body.classList.remove('is-admin'); btn.innerText = "🔒 관리자 로그인"; btn.classList.remove('active'); document.getElementById('admin-panel').style.display = 'none'; document.getElementById('admin-cat-ui').style.display = 'none'; } render(); }
        async function api(path, method='GET', body=null, isRaw=false) {
            const token = localStorage.getItem('gh_token');
            const headers = { 'Accept': isRaw ? 'application/vnd.github.v3.raw' : 'application/vnd.github.v3+json' };
            if(token) headers['Authorization'] = `token ${token}`;
            const opt = { method, headers };
            if(body) opt.body = JSON.stringify(body);
            const res = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`, opt );
            if(!res.ok) { const e = await res.json(); throw new Error(e.message); }
            return isRaw ? await res.blob() : await res.json();
        }
        async function refresh() {
            try {
                const data = await api('');
                categories = data.filter(i => i.type === 'dir').map(i => i.name);
                const list = document.getElementById('cat-list');
                list.innerHTML = `<div class="cat-item ${currentCat===''?'active':''}" onclick="changeCat('')">📂 전체보기</div>`;
                categories.forEach(c => { list.innerHTML += `<div class="cat-item ${currentCat===c?'active':''}" onclick="changeCat('${c}')">📁 ${c}</div>`; });
                const sel = document.getElementById('move-cat-select');
                sel.innerHTML = '<option value="">(최상위)</option>';
                categories.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
                if(currentCat === '') {
                    let files = data.filter(i => i.type === 'file');
                    for(const d of data.filter(i => i.type === 'dir')) {
                        const sub = await api(d.path);
                        files = [...files, ...sub.filter(i => i.type === 'file')];
                    }
                    allFiles = files;
                } else { const data2 = await api(currentCat); allFiles = data2.filter(i => i.type === 'file'); }
                render();
            } catch(e) { console.error(e); }
        }
        function render() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            const imgExts = ['jpg','jpeg','png','gif','webp','bmp','heic'];
            const vidExts = ['mp4','mov','avi','webm','mkv'];
            const valid = [...imgExts, ...vidExts];
            const filtered = allFiles.filter(f => valid.includes(f.name.split('.').pop().toLowerCase()));
            if(filtered.length === 0) { grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:50px; color:#94a3b8;">미디어가 없습니다.</p>'; return; }
            filtered.forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const isVid = vidExts.includes(ext);
                const netlifyUrl = `${window.location.origin}/${file.path}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="admin-btns">
                        <button class="btn-action btn-del" onclick="delFile('${file.path}','${file.sha}',event)">🗑</button>
                        <button class="btn-action btn-move" onclick="openMove('${file.path}','${file.sha}','${file.name}',event)">🚚</button>
                    </div>
                    <div class="media-wrap" id="wrap-${file.sha}">
                        <p style="font-size:10px; color:#aaa;">로딩 중...</p>
                        <span class="badge">${isVid?'VIDEO':'IMAGE'}</span>
                    </div>
                    <div class="info">${file.name}</div>
                `;
                card.onclick = () => { window.location.href = `${CONFIG.wp}?img_url=${encodeURIComponent(netlifyUrl)}`; };
                grid.appendChild(card);
                
                // [v2.4 핵심 로직] Blob 방식으로 미디어 로드
                loadMediaBlob(file, isVid, `wrap-${file.sha}`, netlifyUrl);
            });
        }
        async function loadMediaBlob(file, isVid, containerId, fallbackUrl) {
            const container = document.getElementById(containerId);
            try {
                // 토큰이 있으면 API로 직접 Blob 데이터를 가져옴 (보안 우회)
                const blob = await api(file.path, 'GET', null, true);
                const blobUrl = URL.createObjectURL(blob);
                container.innerHTML = isVid ? 
                    `<video src="${blobUrl}" muted loop playsinline onmouseenter="this.play()" onmouseleave="this.pause()"></video><span class="badge">VIDEO</span>` : 
                    `<img src="${blobUrl}"><span class="badge">IMAGE</span>`;
            } catch (e) {
                // 실패 시 일반 URL로 시도
                container.innerHTML = isVid ? 
                    `<video src="${fallbackUrl}" muted loop playsinline onmouseenter="this.play()" onmouseleave="this.pause()"></video><span class="badge">VIDEO</span>` : 
                    `<img src="${fallbackUrl}" onerror="this.src='https://placehold.co/400x600?text=Load+Error'"><span class="badge">IMAGE</span>`;
            }
        }
        function changeCat(cat ) { currentCat = cat; document.getElementById('path-text').innerText = cat===''?'전체보기':cat; document.getElementById('del-cat-btn').style.display = cat===''?'none':'inline-block'; refresh(); }
        function saveToken() { const t = document.getElementById('token-input').value.trim(); if(t.startsWith('ghp_')) { localStorage.setItem('gh_token', t); alert("저장됨"); refresh(); } else alert("토큰 확인"); }
        async function handleUpload(i) {
            const f = i.files[0]; if(!f) return;
            const st = document.getElementById('up-status'); st.innerText = "업로드 중...";
            try {
                const r = new FileReader();
                r.onload = async () => {
                    const c = r.result.split(',')[1];
                    const p = currentCat ? `${currentCat}/${Date.now()}_${f.name}` : `${Date.now()}_${f.name}`;
                    await api(p, 'PUT', { message: `Upload ${f.name}`, content: c });
                    st.innerText = "성공!"; i.value = ""; setTimeout(refresh, 2000);
                };
                r.readAsDataURL(f);
            } catch(e) { alert(e.message); st.innerText = ""; }
        }
        async function createCat() { const n = document.getElementById('new-cat-name').value.trim(); if(!n) return; try { await api(`${n}/.keep`,'PUT',{message:`Dir ${n}`,content:btoa('')}); closeModal('modal-cat'); changeCat(n); } catch(e) { alert(e.message); } }
        async function delCat() { if(!confirm(`'${currentCat}' 삭제?`)) return; try { const fs = await api(currentCat); for(const f of fs) await api(f.path,'DELETE',{message:'Cleanup',sha:f.sha}); changeCat(''); } catch(e) { alert(e.message); } }
        async function delFile(p,s,e) { e.stopPropagation(); if(confirm("삭제?")) { await api(p,'DELETE',{message:'Del',sha:s}); refresh(); } }
        function openMove(p,s,n,e) {
            e.stopPropagation(); document.getElementById('move-name').value = n;
            const curDir = p.includes('/') ? p.split('/')[0] : "";
            document.getElementById('move-cat-select').value = curDir;
            openModal('modal-move');
            document.getElementById('move-confirm-btn').onclick = async () => {
                const newN = document.getElementById('move-name').value.trim();
                const newC = document.getElementById('move-cat-select').value;
                const newP = newC ? `${newC}/${newN}` : newN;
                if(newP === p) return;
                try { const data = await api(p); await api(newP, 'PUT', { message: `Move to ${newP}`, content: data.content }); await api(p, 'DELETE', { message: `Del old`, sha: s }); alert("이동 완료!"); closeModal('modal-move'); refresh(); } catch(err) { alert(err.message); }
            };
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
