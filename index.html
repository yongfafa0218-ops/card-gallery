<!-- [갤러리 index.html 전체 코드] -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맘풀고 템플릿 관리자</title>
    <style>
        /* (기존 디자인 스타일 유지) */
        :root { --primary: #4A90E2; --bg: #f0f2f5; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #1e293b; color: white; padding: 20px; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img, .card video { width: 100%; height: 280px; object-fit: cover; }
        .admin-only { display: none; }
        body.is-admin .admin-only { display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Mampulgo</h2>
        <button onclick="location.href='https://mampulgo.com/card/'" style="width:100%; padding:10px; margin-bottom:20px; cursor:pointer;">🏠 카드 메이커로</button>
        <div id="cat-list"></div>
        <button onclick="addCat( )" class="admin-only" style="margin-top:20px;">+ 카테고리 추가</button>
    </div>
    <div class="main">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h1 id="view-title">전체보기</h1>
            <button id="admin-login-btn" onclick="toggleAdmin()">🔒 관리자 로그인</button>
        </header>
        <div id="admin-panel" class="admin-only" style="background:white; padding:20px; border-radius:12px; margin-bottom:20px;">
            <input type="password" id="gh-token" placeholder="GitHub 토큰 입력">
            <button onclick="saveToken()">토큰 저장</button>
            <hr>
            <input type="file" id="file-input">
            <button onclick="uploadFile()">업로드</button>
        </div>
        <div class="grid" id="gallery-grid"></div>
    </div>

    <script>
        /* 🚀 [v17.0 핵심 수정] 워드프레스 새 주소로 고정 */
        const CONFIG = {
            username: "yongfafa0218-ops",
            repo: "card-gallery",
            wpUrl: "https://mampulgo.com/card/" 
        };

        let currentCat = "";
        let isAdmin = false;

        async function fetchGallery( ) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = "로딩 중...";
            try {
                const res = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${currentCat}` );
                const files = await res.json();
                grid.innerHTML = "";
                files.forEach(f => {
                    if(f.type === 'dir') return;
                    const card = document.createElement('div');
                    card.className = 'card';
                    const isVid = f.name.match(/\.(mp4|mov|webm)$/i);
                    const url = f.download_url;
                    card.innerHTML = isVid ? `<video src="${url}" muted loop autoplay></video>` : `<img src="${url}">`;
                    
                    // 클릭 시 새 워드프레스 주소로 이미지 전달
                    card.onclick = () => {
                        location.href = `${CONFIG.CONFIG.wpUrl}?img_url=${encodeURIComponent(url)}`;
                    };
                    grid.appendChild(card);
                });
            } catch(e) { grid.innerHTML = "오류 발생"; }
        }

        function toggleAdmin() {
            isAdmin = !isAdmin;
            document.body.classList.toggle('is-admin', isAdmin);
            document.getElementById('admin-login-btn').innerText = isAdmin ? "🔓 관리자 모드" : "🔒 관리자 로그인";
        }
        
        function saveToken() {
            localStorage.setItem('mampulgo_token', document.getElementById('gh-token').value);
            alert("저장됨");
        }

        window.onload = fetchGallery;
        // (업로드 및 카테고리 로직 생략 - 기존 기능 유지)
    </script>
</body>
</html>
